<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liaa-Ai - Chat Assistant</title>

    <!-- ✅ PWA Meta Tags -->
    <meta name="description" content="Liaa-Ai - Chat Assistant berbasis AI yang cerdas">
    <meta name="theme-color" content="#89b4fa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Liaa-Ai">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- ✅ PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">

    <!-- ✅ PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #1e1e2e;
            --bg-sidebar: #181825;
            --bg-chat-user: #45475a;
            --bg-chat-bot: #313244;
            --text-color: #cdd6f4;
            --accent-color: #89b4fa;
            --border-color: #313244;
            --input-bg: #313244;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            position: relative;
        }

        html {
            height: -webkit-fill-available;
        }

        /* =============================================
           TOMBOL INSTALL PWA / DOWNLOAD APK
        ============================================= */
        #pwa-install-banner {
            display: none; /* Tersembunyi by default, muncul otomatis */
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: linear-gradient(135deg, #89b4fa, #cba6f7);
            color: #1e1e2e;
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(137, 180, 250, 0.4);
            animation: floatUp 0.4s ease;
            white-space: nowrap;
        }

        #pwa-install-banner.hidden {
            display: none !important;
        }

        #pwa-install-banner:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 6px 25px rgba(137, 180, 250, 0.6);
        }

        #pwa-install-banner i {
            font-size: 16px;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Tombol install di header (opsional) */
        .install-header-btn {
            background: linear-gradient(135deg, #89b4fa, #cba6f7);
            color: #1e1e2e;
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: none; /* Muncul saat PWA bisa diinstall */
            align-items: center;
            gap: 6px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .install-header-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 12px rgba(137, 180, 250, 0.4);
        }

        .install-header-btn.visible {
            display: flex;
        }

        /* Offline Banner */
        #offline-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #f38ba8;
            color: #1e1e2e;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            z-index: 9999;
        }

        #offline-banner.show {
            display: block;
        }

        /* --- SIDEBAR STYLE --- */
        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
            border-right: 1px solid var(--border-color);
            transition: transform 0.3s ease;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 10;
            transform: translateX(-100%);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .new-chat-btn {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
            font-size: 16px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: var(--bg-chat-bot);
        }

        .history-container {
            flex: 1;
            margin-top: 25px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 11px;
            color: #6c7086;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 15px;
        }

        .history-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-item:hover, .history-item.active {
            background-color: var(--bg-chat-bot);
            color: var(--accent-color);
        }

        .delete-history-btn {
            background: transparent;
            border: none;
            color: #f38ba8;
            cursor: pointer;
            padding: 4px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .delete-history-btn:hover {
            opacity: 1;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 5;
        }

        .overlay.show {
            display: block;
        }

        /* --- CHAT CONTAINER STYLE --- */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: var(--bg-main);
        }

        .menu-toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }

        .chat-header span#statusBadge {
            font-size: 11px;
            color: #a6e3a1;
            background: rgba(166, 227, 161, 0.1);
            padding: 3px 10px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .chat-header span#statusBadge.typing {
            color: var(--accent-color);
            background: rgba(137, 180, 250, 0.1);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 15px;
            word-break: break-word;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background-color: var(--bg-chat-user);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            background-color: var(--bg-chat-bot);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message i {
            margin-top: 4px;
            font-size: 16px;
            color: var(--accent-color);
        }

        /* --- INPUT AREA STYLE --- */
        .chat-input-container {
            padding: 12px 15px;
            background-color: var(--bg-main);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 50px 14px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-color);
        }

        .send-btn {
            position: absolute;
            right: 8px;
            background: var(--accent-color);
            border: none;
            color: var(--bg-sidebar);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* --- ANIMASI TITIK BERFIKIR --- */
        .typing-indicator {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 8px 10px;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: pulse 1.2s infinite ease-in-out;
            opacity: 0.4;
        }
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        @media (min-width: 768px) {
            .sidebar {
                position: relative;
                transform: translateX(0);
                width: 260px;
            }
            .menu-toggle-btn {
                display: none;
            }
            .overlay {
                display: none !important;
            }
            .message {
                max-width: 70%;
            }
            .input-wrapper {
                max-width: 800px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <!-- ✅ Offline Banner -->
    <div id="offline-banner">
        <i class="fa-solid fa-wifi-slash"></i> Kamu sedang offline. Beberapa fitur mungkin tidak tersedia.
    </div>

    <!-- ✅ Tombol Install PWA / Download ke Layar Utama -->
    <button id="pwa-install-banner" class="hidden">
        <i class="fa-solid fa-download"></i>
        Install Liaa-Ai
    </button>

    <div class="overlay" id="overlay"></div>

    <div class="sidebar" id="sidebar">
        <button class="new-chat-btn" id="newChatBtn">
            <i class="fa-solid fa-plus"></i> Chat Baru
        </button>
        <div class="history-container">
            <div class="history-title">Riwayat Chat</div>
            <ul class="history-list" id="historyList"></ul>
        </div>
    </div>

    <div class="chat-main">
        <div class="chat-header">
            <button class="menu-toggle-btn" id="menuToggle">
                <i class="fa-solid fa-bars"></i>
            </button>
            <i class="fa-solid fa-robot" style="color: var(--accent-color); font-size: 20px;"></i>
            <h1>Liaa-Ai</h1>
            <span id="statusBadge">Online</span>
            <!-- ✅ Tombol Install di Header -->
            <button class="install-header-btn" id="installHeaderBtn" title="Install App">
                <i class="fa-solid fa-mobile-screen-button"></i>
                Install
            </button>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-container">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Tanyakan sesuatu..." autocomplete="off" enterkeyhint="send">
                <button class="send-btn" id="sendBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        // ✅ SERVICE WORKER REGISTRATION
        // =====================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('[PWA] Service Worker registered:', reg.scope))
                    .catch(err => console.error('[PWA] SW registration failed:', err));
            });
        }

        // =====================================================
        // ✅ PWA INSTALL PROMPT
        // =====================================================
        let deferredInstallPrompt = null;
        const installBanner = document.getElementById('pwa-install-banner');
        const installHeaderBtn = document.getElementById('installHeaderBtn');

        // Tangkap event sebelum browser menampilkan prompt install
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;

            // Tampilkan tombol install
            installBanner.classList.remove('hidden');
            installHeaderBtn.classList.add('visible');

            console.log('[PWA] Install prompt ready');
        });

        // Fungsi untuk memulai instalasi
        function triggerInstall() {
            if (!deferredInstallPrompt) {
                // Jika sudah terinstall atau di iOS, tampilkan panduan
                alert('📱 Untuk install di iPhone/iPad:\n1. Ketuk ikon Share (kotak panah atas)\n2. Pilih "Add to Home Screen"\n3. Ketuk "Add"\n\nUntuk Android:\n1. Ketuk menu ⋮ di browser\n2. Pilih "Add to Home Screen" atau "Install App"');
                return;
            }
            deferredInstallPrompt.prompt();
            deferredInstallPrompt.userChoice.then((choice) => {
                if (choice.outcome === 'accepted') {
                    console.log('[PWA] User accepted install');
                    installBanner.classList.add('hidden');
                    installHeaderBtn.classList.remove('visible');
                } else {
                    console.log('[PWA] User dismissed install');
                }
                deferredInstallPrompt = null;
            });
        }

        installBanner.addEventListener('click', triggerInstall);
        installHeaderBtn.addEventListener('click', triggerInstall);

        // Sembunyikan tombol setelah app terinstall
        window.addEventListener('appinstalled', () => {
            console.log('[PWA] App installed!');
            installBanner.classList.add('hidden');
            installHeaderBtn.classList.remove('visible');
            deferredInstallPrompt = null;
        });

        // =====================================================
        // ✅ OFFLINE / ONLINE DETECTION
        // =====================================================
        const offlineBanner = document.getElementById('offline-banner');

        function updateOnlineStatus() {
            if (!navigator.onLine) {
                offlineBanner.classList.add('show');
            } else {
                offlineBanner.classList.remove('show');
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // =====================================================
        // CHAT APP LOGIC (ORIGINAL)
        // =====================================================
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menuToggle');
        const overlay = document.getElementById('overlay');
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const historyList = document.getElementById('historyList');
        const statusBadge = document.getElementById('statusBadge');

        const API_URL = "https://api.nexray.eu.cc/ai/claude?text=";
        
        let chatSessions = JSON.parse(localStorage.getItem('aldian_chat_sessions')) || [];
        let currentSessionId = localStorage.getItem('aldian_current_session_id') || null;
        let isTyping = false;

        const welcomeMessage = "Halo! Saya Liaa-Ai. Ada yang bisa saya bantu hari ini?";

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        menuToggle.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
        
        function initApp() {
            if (chatSessions.length === 0 || !currentSessionId) {
                startNewChat();
            } else {
                loadChatSession(currentSessionId);
            }
            renderHistoryList();
        }

        function startNewChat() {
            if(isTyping) return;
            currentSessionId = 'session_' + Date.now();
            const newSession = {
                id: currentSessionId,
                title: "Obrolan Baru",
                messages: [{ text: welcomeMessage, sender: 'bot' }]
            };
            chatSessions.unshift(newSession);
            saveData();
            loadChatSession(currentSessionId);
            renderHistoryList();
        }

        function saveData() {
            localStorage.setItem('aldian_chat_sessions', JSON.stringify(chatSessions));
            localStorage.setItem('aldian_current_session_id', currentSessionId);
        }

        function loadChatSession(id) {
            if(isTyping) return; 
            currentSessionId = id;
            localStorage.setItem('aldian_current_session_id', currentSessionId);
            
            const session = chatSessions.find(s => s.id === id);
            chatMessages.innerHTML = '';
            
            if (session) {
                session.messages.forEach(msg => {
                    displayMessageHTML(msg.text, msg.sender);
                });
            }
            
            document.querySelectorAll('.history-item').forEach(item => {
                item.classList.remove('active');
                if(item.dataset.id === id) item.classList.add('active');
            });
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function deleteChatSession(id, event) {
            event.stopPropagation();
            if(isTyping) return;
            chatSessions = chatSessions.filter(s => s.id !== id);
            
            if (currentSessionId === id) {
                currentSessionId = chatSessions.length > 0 ? chatSessions[0].id : null;
            }
            
            saveData();
            initApp();
        }

        function renderHistoryList() {
            historyList.innerHTML = '';
            chatSessions.forEach(session => {
                const li = document.createElement('li');
                li.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
                li.dataset.id = session.id;
                
                li.innerHTML = `
                    <div class="history-text">
                        <i class="fa-regular fa-comment"></i>
                        <span>${session.title}</span>
                    </div>
                    <button class="delete-history-btn" onclick="deleteChatSession('${session.id}', event)">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                `;
                
                li.addEventListener('click', () => {
                    loadChatSession(session.id);
                    if (window.innerWidth < 768) toggleSidebar();
                });
                
                historyList.appendChild(li);
            });
        }

        function displayMessageHTML(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            const icon = sender === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';
            messageDiv.innerHTML = `${icon} <div>${text}</div>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        function typeWriterEffect(text, containerElement, currentSession) {
            let index = 0;
            const textZone = containerElement.querySelector('div');
            textZone.innerHTML = "";
            
            statusBadge.innerText = "Aldian-Ai sedang mengetik...";
            statusBadge.classList.add('typing');

            const speed = 15; 

            function type() {
                if (index < text.length) {
                    textZone.innerHTML += text.charAt(index);
                    index++;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    setTimeout(type, speed);
                } else {
                    statusBadge.innerText = "Online";
                    statusBadge.classList.remove('typing');
                    isTyping = false;
                    
                    currentSession.messages.push({ text: text, sender: 'bot' });
                    saveData();
                }
            }
            type();
        }

        function showTypingIndicator() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.id = 'typingIndicator';
            loadingDiv.innerHTML = `
                <i class="fa-solid fa-robot"></i>
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function sendMessage() {
            if(isTyping) return;
            
            const text = userInput.value.trim();
            if (!text) return;

            displayMessageHTML(text, 'user');
            userInput.value = '';
            userInput.blur();

            const currentSession = chatSessions.find(s => s.id === currentSessionId);
            currentSession.messages.push({ text: text, sender: 'user' });

            if (currentSession.title === "Obrolan Baru" || currentSession.messages.length === 2) {
                currentSession.title = text;
                renderHistoryList();
            }
            saveData();

            showTypingIndicator();
            isTyping = true;

            try {
                const response = await fetch(`${API_URL}${encodeURIComponent(text)}`);
                const data = await response.json();
                
                removeTypingIndicator();

                if (data.status && data.result) {
                    const botMsgBubble = displayMessageHTML("", 'bot');
                    typeWriterEffect(data.result, botMsgBubble, currentSession);
                } else {
                    isTyping = false;
                    const errMsg = "Maaf, respon tidak valid.";
                    displayMessageHTML(errMsg, 'bot');
                    currentSession.messages.push({ text: errMsg, sender: 'bot' });
                    saveData();
                }
            } catch (error) {
                isTyping = false;
                removeTypingIndicator();
                const errMsg = navigator.onLine 
                    ? "Gagal terhubung ke Aldian-Ai." 
                    : "Kamu sedang offline. Periksa koneksi internetmu.";
                displayMessageHTML(errMsg, 'bot');
                currentSession.messages.push({ text: errMsg, sender: 'bot' });
                saveData();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        newChatBtn.addEventListener('click', startNewChat);

        window.addEventListener('resize', () => {
            if (document.activeElement.tagName === 'INPUT') {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        });

        // Jalankan aplikasi
        initApp();
    </script>
</body>
</html>
